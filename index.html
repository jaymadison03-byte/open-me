<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Me ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
 overflow:hidden;font-family:Georgia,"Times New Roman",serif;
 background:linear-gradient(135deg,#fff0f5,#ffe4ec,#fff8fb);color:#5c2638;
}
.card{
 width:min(90%,560px);padding:42px 30px;text-align:center;
 background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.9);
 border-radius:28px;box-shadow:0 20px 60px rgba(124,45,76,.18);
 backdrop-filter:blur(8px);position:relative;z-index:2;
 animation:appear 1.2s ease;
}
.flower{font-size:42px;margin-bottom:10px;animation:sway 2.5s ease-in-out infinite}
h1{margin:0 0 18px;font-size:clamp(30px,7vw,48px);color:#a52f5b}
.message{font-size:clamp(19px,4.5vw,25px);line-height:1.65;margin:0 auto 25px}
.signature{font-size:17px;opacity:.75}
#open{
 border:0;border-radius:999px;padding:13px 27px;margin-top:22px;
 background:#a52f5b;color:white;font-size:16px;cursor:pointer;
 box-shadow:0 8px 22px rgba(165,47,91,.25);
}
#open.hidden{display:none}
#music{display:none}
.heart{position:fixed;bottom:-40px;font-size:22px;animation:floatUp linear infinite;opacity:.7;z-index:1}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-5px)}}
@keyframes floatUp{from{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:.7}to{transform:translateY(-115vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<div class="card">
  <div class="flower">🌷</div>
  <h1>Happy Teacher's Day, baby. ❤️</h1>
  <p class="message">
    To the aspiring teacher who makes every lesson a little more special…<br>
    <strong>Happy Teacher's Day, baby. ❤️</strong>
  </p>
  <div class="signature">— A little message just for you 🌸</div>

  <button id="open">Tap to Open ❤️</button>

  <audio id="music" preload="auto" loop>
    <source src="kalapastangan.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
const audio=document.getElementById("music");
const btn=document.getElementById("open");

async function startMusic(){
  try{
    await audio.play();
    btn.classList.add("hidden");
  }catch(e){
    btn.classList.remove("hidden");
  }
}

window.addEventListener("load",startMusic);

btn.addEventListener("click",async()=>{
  try{
    await audio.play();
    btn.classList.add("hidden");
  }catch(e){}
});

const emojis=["❤️","💗","🌸","🌷","💕","✨"];
for(let i=0;i<28;i++){
 const el=document.createElement("div");
 el.className="heart";
 el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
 el.style.left=Math.random()*100+"vw";
 el.style.animationDuration=(6+Math.random()*8)+"s";
 el.style.animationDelay=(Math.random()*7)+"s";
 el.style.fontSize=(16+Math.random()*18)+"px";
 document.body.appendChild(el);
}
</script>
</body>
</html>
